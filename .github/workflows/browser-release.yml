name: Build browser release packages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact_name: ${{ steps.package-info.outputs.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version $version"
          }
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run lint
      - run: npm run test:random
      - run: npm run build:all
      - run: npm run verify:builds
      - run: npm run lint:firefox
      - name: Record verified package checksums
        id: package-info
        run: |
          $version = node -p "require('./package.json').version"
          $name = if ($env:GITHUB_EVENT_NAME -eq 'release') {
            "jizhi-v$version-store-upload"
          } else {
            "jizhi-v$version-test-$env:GITHUB_RUN_ID"
          }
          "name=$name" >> $env:GITHUB_OUTPUT
          @(
            "Version: $version"
            "Commit: $(git rev-parse HEAD)"
            "Ref: $env:GITHUB_REF"
          ) | Set-Content -Encoding utf8 builds/BUILD-INFO.txt
          $checksums = foreach ($file in 'chrome.zip','edge.zip','firefox.zip','firefox-source.zip') {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "builds/$file").Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $checksums | Set-Content -Encoding utf8 builds/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package-info.outputs.name }}
          if-no-files-found: error
          path: |
            builds/chrome.zip
            builds/edge.zip
            builds/firefox.zip
            builds/firefox-source.zip
            builds/BUILD-INFO.txt
            builds/SHA256SUMS.txt

  attach-to-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: packages
      - name: Attach packages to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload --repo "$GITHUB_REPOSITORY" -- "$RELEASE_TAG" \
            packages/chrome.zip packages/edge.zip packages/firefox.zip
